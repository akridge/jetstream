site_name: JetStream
site_description: NOAA JetStream moves research data from your computer to Google Cloud Storage, and proves it arrived intact.
site_url: https://akridge.github.io/jetstream/
repo_url: https://github.com/akridge/jetstream
repo_name: akridge/jetstream
edit_uri: edit/main/website/docs/
copyright: NOAA JetStream

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Get started:
      - Download and install: download.md
      - Your first upload: getting-started.md
  - Guides:
      - Synced folders: guides/folders.md
      - Uploads and speed: guides/uploads.md
      - Verification receipts: guides/receipts.md
      - File details: guides/file-details.md
      - Cloud storage: guides/cloud-storage.md
      - Catalogs: guides/catalogs.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - For IT and admins: admins.md
  - What's new: changelog.md
  - Developers: developers.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["..", "."]
      check_paths: true

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/akridge/jetstream
