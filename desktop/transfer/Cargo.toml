[package]
name = "jetstream-transfer"
version = "0.1.0"
description = "JetStream upload engine: incremental folder sync to Google Cloud Storage with resumable, verified uploads"
edition = "2021"
publish = false

[[bin]]
name = "jetstream-transfer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
futures = "0.3"
percent-encoding = "2"
rand = "0.9"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "process"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
