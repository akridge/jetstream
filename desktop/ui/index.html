<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOAA JetStream</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            color: #1a202c;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f1419; color: #f7fafc; }
            pre { background: #1a2332; border-color: #2d3748; }
        }
        main { max-width: 760px; padding: 32px; text-align: center; }
        img { width: 180px; height: 180px; object-fit: contain; }
        h1 { font-size: 1.6em; margin: 8px 0; }
        p { color: #718096; }
        .spinner {
            width: 36px;
            height: 36px;
            margin: 20px auto;
            border: 4px solid #cbd5e0;
            border-top-color: #3182ce;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #error { display: none; text-align: left; }
        #error h2 { color: #c53030; font-size: 1.2em; }
        pre {
            max-height: 320px;
            overflow: auto;
            padding: 12px;
            font-size: 12px;
            white-space: pre-wrap;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <main>
        <img src="logo.png" alt="">
        <h1>NOAA JetStream</h1>
        <div id="loading">
            <div class="spinner"></div>
            <p>Starting JetStream…</p>
        </div>
        <div id="error">
            <h2>JetStream could not start</h2>
            <p id="error-message"></p>
            <pre id="error-log"></pre>
            <p>Close JetStream from the tray icon and open it again. If it keeps failing, send the text above to your data manager.</p>
        </div>
    </main>
    <script>
        // Called by the desktop shell if the bundled server fails to start.
        window.showStartupError = function(message, log) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-log').textContent = log || '(no server output)';
        };
    </script>
</body>
</html>
