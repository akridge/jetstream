name: Build desktop app

# Builds JetStream Desktop for Windows, macOS and Linux: installers (.msi and setup .exe on
# Windows, .dmg, .AppImage/.deb) plus a portable .zip for Windows and Linux. Each platform's
# files are uploaded as a workflow artifact. It runs on pushes that change the app (any
# branch), by hand from the Actions tab, and on tags like desktop-v0.1.29, which also create
# a draft release with everything attached.
# To build locally instead: desktop/scripts/build_windows.ps1 or desktop/scripts/build_desktop.py.
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "desktop-v*"
    # Path filters apply to branch pushes only; tag pushes always build.
    paths:
      - "desktop/**"
      - "jetstream/**"
      - "requirements.txt"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            desktop/transfer -> target

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build bundled JetStream server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python desktop/scripts/build_sidecar.py

      - name: Build JetStream upload engine
        run: python desktop/scripts/build_engine.py

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci || npm install

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('JetStream Desktop {0}', github.ref_name) || '' }}
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package portable build and collect installers
        # Windows: JetStream-<version>-windows-x64-portable.zip (unzip and run, no install)
        # plus the .msi and setup .exe. Linux: a portable .zip plus .AppImage/.deb.
        # macOS: the .dmg (the .app inside is already portable).
        run: python desktop/scripts/build_desktop.py --package-only

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: jetstream-desktop-${{ matrix.platform }}
          path: desktop/release/*
          if-no-files-found: error

      - name: Attach portable build to the draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v') && matrix.platform != 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: desktop/release/*-portable.zip
