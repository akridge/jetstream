name: Build desktop app (Windows)

# Builds JetStream Desktop for Windows: the portable .zip (unzip and run; the main download)
# plus the .msi and setup .exe installers, uploaded as a workflow artifact. It runs on pushes
# that change the app (any branch), by hand from the Actions tab, and on tags like
# desktop-v0.2.0, which also create a draft release with everything attached.
#
# Versions: the desktop app has its own version (desktop/src-tauri/tauri.conf.json; change it
# with desktop/scripts/set_version.py), separate from the Python package. Every build also
# carries its build number and commit (JETSTREAM_BUILD / JETSTREAM_COMMIT below), shown in the
# app and in the portable zip's name: JetStream-0.2.0-build18-windows-x64-portable.zip.
#
# macOS and Linux builds are in desktop-mac-linux.yml (run by hand for now).
# To build locally instead: desktop/scripts/build_windows.ps1 or desktop/scripts/build_desktop.py.
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "desktop-v*"
    # Path filters apply to branch pushes only; tag pushes always build.
    paths:
      - "desktop/**"
      - "jetstream/**"
      - "requirements.txt"
      - ".github/workflows/desktop.yml"
      - "desktop/scripts/**"
      # Documentation-only changes don't rebuild (and don't cancel a build in progress).
      - "!**/*.md"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      JETSTREAM_BUILD: ${{ github.run_number }}
      JETSTREAM_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check the desktop version
        # The version files must agree; a release tag must match them.
        run: python desktop/scripts/set_version.py --check ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('--tag {0}', github.ref_name) || '' }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            desktop/transfer -> target

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build bundled JetStream server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python desktop/scripts/build_sidecar.py --portable

      - name: Build JetStream upload engine
        run: python desktop/scripts/build_engine.py

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci || npm install

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('JetStream Desktop {0}', github.ref_name) || '' }}
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package portable build and collect installers
        # JetStream-<version>-build<N>-windows-x64-portable.zip (unzip and run, no install; the
        # server is a folder inside it) plus the .msi and setup .exe.
        run: python desktop/scripts/build_desktop.py --package-only

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: jetstream-desktop-${{ matrix.platform }}
          path: desktop/release/*
          if-no-files-found: error

      - name: Attach portable build to the draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: desktop/release/*-portable.zip
